name: RentNear CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-ci:
    name: Backend Lint, Test & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: 'rental-backend/package-lock.json'

      - name: Install Dependencies
        run: |
          cd rental-backend
          npm install

      - name: Run Backend Tests
        run: |
          cd rental-backend
          npm test

  frontend-ci:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: 'rental-app/package-lock.json'

      - name: Install Dependencies
        run: |
          cd rental-app
          npm install

      - name: Run Frontend Tests
        run: |
          cd rental-app
          npm test

      - name: Verify Build
        run: |
          cd rental-app
          npm run build
